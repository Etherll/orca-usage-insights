name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build panel
        shell: bash
        run: node scripts/build.mjs
      - name: Check committed panel is current
        shell: bash
        run: git diff --exit-code panel/index.html
      - name: Test
        shell: bash
        run: node --test tests/*.test.mjs
